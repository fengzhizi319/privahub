# =============================================================================
# Privahub single-node compose (hardened defaults).
#
#   cd deployments/docker
#   cp privahub.env.example privahub.env   # fill in secrets, chmod 600
#   PRIVAHUB_IMAGE=ghcr.io/fengzhizi319/privahub:1.0.0 docker compose up -d
#
# Security defaults:
#   * every published port binds 127.0.0.1 — put a TLS reverse proxy in front
#     of 8080 and expose 9001 only to the Kuscia gateway network if needed;
#   * read-only root FS, all capabilities dropped, no-new-privileges;
#   * secrets come from privahub.env (gitignored), never from this file;
#   * our image is referenced by an explicit version, never :latest.
# =============================================================================
services:
  privahub:
    image: ${PRIVAHUB_IMAGE:-ghcr.io/fengzhizi319/privahub:1.0.0}
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    env_file:
      - privahub.env
    ports:
      - "127.0.0.1:${PRIVAHUB_HTTP_PORT:-8080}:8080"
      # Inner port: loopback only by default. To let a Kuscia gateway in
      # another container reach it, attach both to a private network instead
      # of publishing it, and configure server.inner_auth.
      - "127.0.0.1:${PRIVAHUB_INNER_PORT:-9001}:9001"
    volumes:
      - privahub-data:/app/data
      - privahub-audit:/app/audit
      - privahub-certs:/app/config/certs
      - privahub-kuscia:/app/config/kuscia
      - privahub-sync:/app/config/sync
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  privahub-data:
  privahub-audit:
  privahub-certs:
  privahub-kuscia:
  privahub-sync:
