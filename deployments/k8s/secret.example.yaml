# EXAMPLE ONLY - do not commit real values. Create the real Secret out of band:
#
#   kubectl -n privahub create secret generic privahub-secrets \
#     --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#     --from-literal=aes-key="$(openssl rand -hex 32)" \
#     --from-literal=inner-token="$(openssl rand -hex 32)" \
#     --from-literal=metrics-token="$(openssl rand -hex 32)"
#   kubectl -n privahub create secret generic kuscia-client-tls \
#     --from-file=client.crt --from-file=client.key --from-file=ca.crt
#
# Prefer an external secret manager (External Secrets Operator, Vault CSI,
# sealed-secrets) in production. This file is NOT part of kustomization.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: privahub-secrets
  namespace: privahub
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_openssl_rand_hex_32"
  aes-key: "REPLACE_WITH_openssl_rand_hex_32"
  inner-token: "REPLACE_WITH_openssl_rand_hex_32"
  metrics-token: "REPLACE_WITH_openssl_rand_hex_32"
