# Privahub talks to KusciaAPI over gRPC/HTTP, not to the Kubernetes API, so it
# needs no ServiceAccount token (no RBAC bindings exist for this account).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: privahub
  namespace: privahub
  labels:
    app.kubernetes.io/name: privahub
automountServiceAccountToken: false
