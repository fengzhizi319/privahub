# =============================================================================
# privahub CI — build, test and security gates.
#
# Local parity: every job maps to a Makefile target (`make check`, `make sec`,
# `make fuzz`, `make openapi-check`, `make hadolint`, `make docker`).
# Rules for editing this file (enforced by scripts/check_gate_failclosed.sh):
#   * no `continue-on-error: true`, no `|| true` on scanners/gates;
#   * third-party actions are pinned by full commit SHA (tag in the comment);
#   * tool versions match the Makefile (GOLANGCI_LINT_VERSION etc.).
# =============================================================================
name: ci

on:
  push:
    branches: [main, "feat/**", "release/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new CVEs in unchanged dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.14" # keep in sync with go.mod `toolchain` and the Dockerfile GO_IMAGE
  GOTOOLCHAIN: local # analyse/build with exactly the toolchain installed below
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  # ---------------------------------------------------------------------------
  # Fast, dependency-free static gates. gate-check runs first: it proves the
  # other gates cannot silently pass.
  # ---------------------------------------------------------------------------
  gates:
    name: static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Ensure PyYAML (k8s manifest gate)
        run: python3 -c 'import yaml' || sudo apt-get install -y --no-install-recommends python3-yaml
      - name: make gate-check fmt-check sqli-check redact-check image-check k8s-check
        run: make gate-check fmt-check sqli-check redact-check image-check k8s-check

  build-test:
    name: build + test (race, CGO)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: CGO_ENABLED=1 go build ./...
      - name: make vet test
        run: make vet test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: golangci-lint (gosec)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          CGO_ENABLED: "1"
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

  vuln:
    name: govulncheck (reachable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # govulncheck exits non-zero only for vulnerabilities reachable from our
      # call graph (symbol-level); imported-but-unreached ones are reported
      # as informational. Stdlib findings follow GO_VERSION above.
      - name: make vuln
        run: make vuln

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret removed later is still leaked
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: make secrets
        env:
          GOTOOLCHAIN: auto # gitleaks' go.mod may require a newer toolchain to build it
        run: make secrets

  openapi:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: make openapi-check
        run: make openapi-check
      - name: regenerate in place and require a clean tree
        run: |
          CGO_ENABLED=1 go run ./cmd/openapi-gen
          git diff --exit-code -- internal/controller/http/apidocs/openapi.json

  fuzz:
    name: fuzz smoke (30s/target)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # scripts/check_fuzz_smoke.sh discovers every FuzzXxx target (currently
      # FuzzGuardBindingConsistency in ./internal/controller/http/middleware)
      # and fails if there are none.
      - name: make fuzz
        run: make fuzz FUZZTIME=30s
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"

  # ---------------------------------------------------------------------------
  # Container: hadolint -> build (with the privaconsole web bundle) -> Trivy
  # (fail on fixable HIGH/CRITICAL) -> SBOMs (image via syft, module via
  # cyclonedx-gomod) as artifacts.
  # ---------------------------------------------------------------------------
  image:
    name: image build + Trivy + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [gates]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: checkout web console (privaconsole) into ./web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fengzhizi319/privaconsole
          ref: ${{ vars.PRIVACONSOLE_REF || 'feat/secretpad-go-migration' }}
          path: web
          # read-only token for the (private) web repo; falls back to the job token
          token: ${{ secrets.PRIVACONSOLE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: hadolint
        run: make hadolint
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/docker/Dockerfile
          load: true
          push: false
          tags: privahub:ci-${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT=${{ github.sha }}
            NPM_REGISTRY=https://registry.npmjs.org
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        # Pinned by SHA: trivy-action tags were force-pushed in the 2026
        # supply-chain incident; never reference it by a mutable tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: privahub:ci-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln,secret
      - name: SBOM (image, CycloneDX via syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: privahub:ci-${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: SBOM (Go modules, CycloneDX)
        env:
          GOTOOLCHAIN: auto
        run: make sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom-image.cdx.json
            sbom.cdx.json
          retention-days: 90

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: actionlint
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
