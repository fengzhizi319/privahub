# Privahub Edge Profile
# Usage: PRIVAHUB_PROFILE=edge NODE_ID=edge-node ./privahub

server:
  mode: "lite"
  http_port: 8080
  inner_port: 9001

database:
  driver: "sqlite"
  dsn: "privahub-edge.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"

kuscia:
  namespace: "${NODE_ID}"
  api_address: "${KUSCIA_API_ADDRESS:127.0.0.1}"
  api_port: 8083
  protocol: "${KUSCIA_PROTOCOL:tls}"
  gateway: "${KUSCIA_GW_ADDRESS:127.0.0.1:1080}"
  nodes:
    - domain_id: "${NODE_ID}"
      mode: "lite"
      host: "${KUSCIA_API_ADDRESS:127.0.0.1}"
      port: 8083
      protocol: "${KUSCIA_PROTOCOL:tls}"

observability:
  log_level: "info"
  log_format: "json"

auth:
  jwt_secret: "${JWT_SECRET:change-me-in-production}"
