# Privahub Development Profile
# Usage: PRIVAHUB_PROFILE=dev ./privahub

server:
  mode: "master"
  http_port: 8080
  inner_port: 9001
  # Dev: relaxed bursts so local e2e runs can log in / create repeatedly
  # (production keeps the Java RateLimitUtil burst of 1).
  rate_limit:
    login_burst: 20
    user_burst: 10
  # OpenAPI document at GET /api/v1alpha1/docs (login required unless public).
  api_docs:
    enabled: true

database:
  driver: "sqlite"
  dsn: "privahub-dev.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"

# Ports below match the default Docker Kuscia host mappings. scripts/dev-start.sh
# overrides them when KUSCIA_*_HOST_PORT is set, via PRIVAHUB_KUSCIA_API_PORT /
# PRIVAHUB_KUSCIA_HTTP_PORT / PRIVAHUB_KUSCIA_GATEWAY and the per-node
# PRIVAHUB_KUSCIA_NODES_<DOMAIN>_{HOST,PORT,HTTP_PORT,PROTOCOL} variables
# (<DOMAIN> = upper-cased domain_id with non-alphanumerics as "_", e.g.
# KUSCIA_SYSTEM, ALICE); see pkg/config/kuscia_nodes_env.go.
kuscia:
  namespace: "kuscia-system"
  api_address: "127.0.0.1"
  api_port: 18083  # Docker mapped gRPC port
  http_port: 18082 # Docker mapped HTTP API port (Envoy REST)
  protocol: "notls"
  gateway: "127.0.0.1:18080"
  nodes:
    - domain_id: "kuscia-system"
      mode: "master"
      host: "127.0.0.1"
      port: 18083
      protocol: "notls"
    - domain_id: "alice"
      mode: "lite"
      host: "127.0.0.1"
      port: 18083
      protocol: "notls"
    - domain_id: "bob"
      mode: "lite"
      host: "127.0.0.1"
      port: 18083
      protocol: "notls"

observability:
  log_level: "debug"
  log_format: "console"

auth:
  jwt_secret: "dev-secret-do-not-use-in-production"

# Data management (datasource / datatable / upload). See pkg/config/data.go.
data:
  # Dev: allow MinIO / MySQL / feature-service endpoints on localhost & LAN.
  ip_block:
    enable: false
