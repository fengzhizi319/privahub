server:
  mode: "master" # Options: master, lite, autonomy
  http_port: 8080
  grpc_port: 9090
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 5s

database:
  driver: "sqlite" # Options: mysql, sqlite
  dsn: "secretpad.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
  max_open_conns: 50
  max_idle_conns: 10

crypto:
  aes_key: "12345678901234567890123456789012" # 32 bytes for AES-256

kuscia:
  kubeconfig: ""
  namespace: "kuscia-system"
  api_address: "127.0.0.1"
  api_port: 8083
  protocol: "notls"

observability:
  enable_metrics: true
  metrics_port: 9091
  log_level: "info"
  log_format: "console" # json for production, console for development

auth:
  jwt_secret: "privahub-dev-secret-change-in-production"
  access_token_expiry: "2h"
  refresh_token_expiry: "168h"
